/* Layout: one narrow logbook column under a sticky header (phase + tabs). Each log section is a card marked by a weight-plate disc in its own plate color: blue = sleep, green = food, red = lifting, yellow = cardio, steel = tape & calipers, ink = the day. */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --sunk:#F4F6F5; --ink:#131A17; --ink2:#3D4843; --muted:#5C6964; --line:#D3DAD6; --line2:#E4E9E6;
  --red:#C0322A; --blue:#2350B5; --yellow:#D9A10C; --green:#1F7D55; --steel:#6E7A75; --day:#131A17;
  --on-red:#FFFFFF; --on-blue:#FFFFFF; --on-yellow:#1A1405; --on-green:#FFFFFF; --on-steel:#FFFFFF; --on-day:#FFFFFF;
  --ok:#1A6E4A; --ok-bg:#DFF0E7; --warn:#8A5A00; --warn-bg:#FAEFD3; --bad:#A92A22; --bad-bg:#F7E1DF; --info:#2350B5; --info-bg:#E3EAF8;
  --btn:#131A17; --on-btn:#FFFFFF;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --morn1:#FFF1D6; --morn2:#FFE2AE; --morn-ink:#3A2A08; --morn-mut:#7A5A1E;
  --display:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1210; --surface:#151C19; --sunk:#111714; --ink:#E6ECE9; --ink2:#C3CDC8; --muted:#90A099; --line:#2B3632; --line2:#212B27;
  --red:#E8625A; --blue:#7298EE; --yellow:#E9BC34; --green:#46B786; --steel:#A0ACA7; --day:#E6ECE9;
  --on-red:#0D1210; --on-blue:#0D1210; --on-yellow:#0D1210; --on-green:#0D1210; --on-steel:#0D1210; --on-day:#0D1210;
  --ok:#6BD3A2; --ok-bg:#14291F; --warn:#EDC14A; --warn-bg:#2B2410; --bad:#F38A82; --bad-bg:#301816; --info:#9BB7F4; --info-bg:#172138;
  --btn:#E6ECE9; --on-btn:#0D1210; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --morn1:#3A2C12; --morn2:#271D0D; --morn-ink:#FBE7C2; --morn-mut:#D9BC80; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1210; --surface:#151C19; --sunk:#111714; --ink:#E6ECE9; --ink2:#C3CDC8; --muted:#90A099; --line:#2B3632; --line2:#212B27;
  --red:#E8625A; --blue:#7298EE; --yellow:#E9BC34; --green:#46B786; --steel:#A0ACA7; --day:#E6ECE9;
  --on-red:#0D1210; --on-blue:#0D1210; --on-yellow:#0D1210; --on-green:#0D1210; --on-steel:#0D1210; --on-day:#0D1210;
  --ok:#6BD3A2; --ok-bg:#14291F; --warn:#EDC14A; --warn-bg:#2B2410; --bad:#F38A82; --bad-bg:#301816; --info:#9BB7F4; --info-bg:#172138;
  --btn:#E6ECE9; --on-btn:#0D1210; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --morn1:#3A2C12; --morn2:#271D0D; --morn-ink:#FBE7C2; --morn-mut:#D9BC80; color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
button,label,summary{-webkit-tap-highlight-color:transparent}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:10px}
.brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.phase-pick{margin-left:auto;display:flex;align-items:center;gap:8px}
.phase-pick select{appearance:none;-webkit-appearance:none;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:6px 30px 6px 12px;font-weight:600;font-size:14px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--steel);display:inline-block}
.status[data-s="saved"] i{background:var(--ok)} .status[data-s="saving"] i,.status[data-s="unsaved"] i{background:var(--yellow)}
.status[data-s="error"] i,.status[data-s="readonly"] i{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--muted)} .small{font-size:13px}
.notice{border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--info-bg);color:var(--info)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice b{font-weight:600}

/* date bar + plan */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .d{flex:1;min-width:0;text-align:center}
.datebar .d strong{display:block;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.datebar .d span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;display:grid;place-items:center;flex:none}
.textbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn{border:0;background:var(--btn);color:var(--on-btn);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.plan{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.plan .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plan h2{font-size:30px;font-weight:700}
.plan .lines{display:flex;flex-direction:column;gap:6px;font-size:14px}
.plan .line{display:flex;gap:10px;align-items:baseline}
.plan .line b{font-weight:600;min-width:86px;flex:none;color:var(--ink2);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--sunk);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}

/* sections */
details.sec{--sec:var(--steel);--on-sec:var(--on-steel)}
details.sec.s-sleep{--sec:var(--blue);--on-sec:var(--on-blue)}
details.sec.s-food{--sec:var(--green);--on-sec:var(--on-green)}
details.sec.s-train{--sec:var(--red);--on-sec:var(--on-red)}
details.sec.s-cardio{--sec:var(--yellow);--on-sec:var(--on-yellow)}
details.sec.s-day{--sec:var(--day);--on-sec:var(--on-day)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
details.sec>summary::-webkit-details-marker{display:none}
.plate{width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--surface) 0 3px,var(--sec) 3.5px 8.5px,color-mix(in srgb,var(--sec) 70%,var(--surface)) 9px)}
.sec-t{flex:1;min-width:0}
.sec-t h3{font-size:20px}
.sec-t .sum{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none;margin-right:4px}
details[open]>summary .chev{transform:rotate(-135deg)}
.sec-b{padding:4px 16px 18px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line2)}
.sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:13px;font-weight:500;color:var(--ink2)}
.f>span em{font-style:normal;color:var(--muted);font-weight:400}
.f input[type=text],.f input[type=time],.f input[type=date],.f textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:16px;min-height:42px}
.f textarea{min-height:66px;resize:vertical;line-height:1.4}
.f input::placeholder,.f textarea::placeholder{color:var(--muted);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.chip.n{min-width:40px;padding:0 10px}
.chip[aria-pressed="true"]{background:var(--sec);color:var(--on-sec);border-color:var(--sec);font-weight:600}
.scale-note{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.ck{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;min-height:32px}
.ck input{width:20px;height:20px;accent-color:var(--sec);margin:0}
.calc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.calc strong{font-family:var(--display);font-size:22px;font-weight:600}
.planbox{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px;border-left:3px solid var(--sec)}
.planbox b{font-weight:600}

.meal{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line2);border-radius:10px;background:color-mix(in srgb,var(--sunk) 60%,var(--surface))}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.meal-h h4{margin:0;font-family:var(--display);font-size:18px;font-weight:600}
.meal-h span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-direction:column;gap:4px;font-size:13px}
.bar .lab{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar .track{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--sec);width:0}
.bar .fill.over{background:var(--bad)}

.ex{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line2)}
.ex:first-child{border-top:0}
.ex-n{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.ex-n b{font-weight:600}
.rx{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--red);border:1px solid currentColor;border-radius:4px;padding:0 5px}
.ex-note{font-size:12.5px;color:var(--muted)}
.ex-in{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.ex-in input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-height:40px}

/* history */
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:22px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:0 4px 14px rgb(0 0 0 / .12);white-space:nowrap;font-variant-numeric:tabular-nums}
.chart-tip strong{font-size:15px;display:block}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.daylist{display:flex;flex-direction:column}
.dayrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 4px;border-top:1px solid var(--line2);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.dayrow:hover{background:var(--sunk)}
.dayrow .dd{font-weight:600}
.dayrow .meta{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:normal}
.empty{color:var(--muted);font-size:14px;margin:0}
.floor{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.floor .fl{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.floor .fl b{font-weight:600;font-size:14px}
.floor .fl div{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.floor .fl div span{color:var(--ink)}

/* cheat sheet */
.phase-chips{display:flex;gap:6px;flex-wrap:wrap}
.phase-chips .chip{--sec:var(--ink);--on-sec:var(--bg)}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.targets div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.targets small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.targets strong{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.cs ol,.cs ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cs li{padding-left:2px}
.cs li b{font-weight:600}
.cs h3{font-size:19px}
.cs .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cs .box{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cs .box.keep{border-color:color-mix(in srgb,var(--green) 45%,var(--line2))}
.cs .box.drop{border-color:color-mix(in srgb,var(--yellow) 55%,var(--line2))}
.cs .box h3{display:flex;align-items:center;gap:8px}
.cs .rules li{line-height:1.45}
.claude-note{font-size:13.5px;border-left:3px solid var(--blue);padding:6px 10px;background:var(--info-bg);border-radius:0 8px 8px 0}

/* share */
.share textarea{width:100%;min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-color:var(--ink)}
/* bottom tab bar */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.bottomnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0 2px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;min-width:0;white-space:nowrap}
.bottomnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottomnav button[aria-selected="true"]{color:var(--ink)}
.bottomnav button[aria-selected="true"] svg{stroke-width:2.3}
/* workout */
.wprog .bar{margin-top:2px}
.excard{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;--sec:var(--red);--on-sec:var(--on-red)}
.excard.alldone{border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exh h3{font-size:21px}
.excount{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:4px}
.excard.alldone .excount{color:var(--ok)}
.cue{font-size:13px;color:var(--ink2)}
.hint{font-size:13px;background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:6px 10px;font-weight:500}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 44px;gap:7px;align-items:center;padding:6px;border-radius:12px;background:var(--sunk);transition:background .15s}
.setrow.bw{grid-template-columns:20px minmax(0,1fr) 44px}
.setrow.done{background:color-mix(in srgb,var(--green) 15%,var(--surface))}
.setno{font-family:var(--display);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.stepper{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;height:50px;overflow:hidden}
.stepper button{height:100%;border:0;background:transparent;font-size:22px;font-weight:500;color:var(--ink);cursor:pointer;padding:0;touch-action:manipulation}
.stepper button:active{background:var(--line2)}
.stepper label{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;line-height:1}
.stepper input{width:100%;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:23px;font-weight:600;padding:0;min-width:0;height:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stepper input.sugg{color:var(--muted);opacity:.75}
.stepper small{font-size:9.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;margin-top:2px}
.setdone{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:19px;font-weight:700;color:var(--muted);cursor:pointer;touch-action:manipulation}
.setdone[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.setbtns{display:flex;gap:8px;flex-wrap:wrap}
.feelbox{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.feelbox.ask{border-top:0;background:var(--ok-bg);border-radius:10px;padding:10px 12px}
.restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:8;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.restbar .in{max-width:736px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--btn);color:var(--on-btn);border-radius:14px;padding:8px 10px 8px 14px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.restbar strong{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px;line-height:1}
.restbar span{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar button{background:color-mix(in srgb,var(--on-btn) 18%,transparent);color:inherit;border:0;border-radius:999px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer}
.restbar.over .in{background:var(--green);color:var(--on-green)}
body.resting main{padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}
/* charts */
.chblock{display:flex;flex-direction:column;gap:6px;padding-top:4px;min-width:0}
.chhead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.chhead h3{font-size:17px}
.chhead h4{font-family:var(--display);font-size:15px;font-weight:600;margin:0}
.chsub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch{min-width:0}
.ch svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;font-family:var(--body)}
.ch svg .gl{stroke:var(--line2);stroke-width:1}
.ch svg .tk{fill:var(--muted);font-size:10.5px}
.ch svg .band{fill:var(--line2)}
.ch svg .ref{stroke:var(--ink2);stroke-width:1.5;fill:none;opacity:.75}
.ch svg .rl{fill:var(--ink2);font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.ch svg .xh{stroke:var(--muted);stroke-width:1}
.ch .legend{margin-bottom:2px}
.legend i.ln{width:14px;height:2px;border-radius:1px}
.legend i.dot{width:9px;height:9px;border-radius:50%}
.legend i.sq{width:10px;height:10px;border-radius:2px}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart-tip .tt-d{font-size:11.5px;color:var(--muted)}
.chart-tip .tt-r{display:flex;align-items:center;gap:6px}
.chart-tip .tt-r i{width:12px;height:2px;border-radius:1px;display:inline-block;flex:none}
.chart-tip .tt-r strong{font-size:14px;display:inline}
.chart-tip .tt-x{font-size:11.5px;color:var(--muted)}
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 16px}
.two-d{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut svg{width:116px;height:116px;flex:none}
.donut svg .dn{font-family:var(--display);font-size:26px;font-weight:700;fill:var(--ink)}
.donut svg .dl{font-size:10px;fill:var(--muted)}
.dleg{display:flex;flex-direction:column;gap:7px;font-size:13.5px;min-width:0}
.dleg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.dleg i{width:10px;height:10px;border-radius:2px}
.dleg b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.dleg .muted{font-variant-numeric:tabular-nums;text-align:right;min-width:34px}
/* food */
.fuel{padding:16px;display:flex;flex-direction:column;gap:12px;--sec:var(--green)}
.fuelrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fuelnum{display:flex;flex-direction:column}
.fuelnum small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fuelnum strong{font-family:var(--display);font-size:42px;font-weight:700;line-height:1.05}
.fuelnum span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.leftline{font-size:14.5px}
.leftline b{font-weight:600}
.pips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.pip b{font-family:var(--display);font-size:21px;color:var(--ink);font-weight:600;line-height:1.1}
.pip.part{border-color:color-mix(in srgb,var(--yellow) 70%,var(--line))}
.pip.ok{background:color-mix(in srgb,var(--green) 15%,var(--surface));border-color:color-mix(in srgb,var(--green) 55%,var(--line))}
.pip.sel{box-shadow:0 0 0 2px var(--ink)}
.foodcat{display:flex;flex-direction:column;gap:6px}
.foodcat .chip{min-height:34px;font-size:13.5px;padding:0 11px}
.platelist{display:flex;flex-direction:column;gap:6px}
.plate-it{display:grid;grid-template-columns:minmax(0,1fr) 128px 32px;gap:8px;align-items:center;padding:6px 6px 6px 10px;border-radius:10px;background:var(--sunk)}
.plate-it .nm{font-size:14px;min-width:0;font-weight:500}
.plate-it .nm small{display:block;color:var(--muted);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.plate-it .stepper{height:42px}
.plate-it .stepper span{font-family:var(--display);font-size:16px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmx{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);font-size:15px;padding:0}
.plate-tot{display:flex;flex-direction:column;gap:2px;font-size:14px;font-variant-numeric:tabular-nums;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--green) 10%,var(--surface))}
.plate-tot strong{font-family:var(--display);font-size:24px;font-weight:700}
.suggs{display:grid;gap:8px}
.sugg-card{border:1px solid color-mix(in srgb,var(--green) 40%,var(--line));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sugg-card b{font-weight:600}
.favrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line2);align-items:center}
.favrow:first-child{border-top:0}
.favrow .t{font-weight:600;font-size:14px}
.favrow .d{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.favrow .acts{display:flex;gap:6px;align-items:center;grid-row:1/3;grid-column:2}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 14px}
.shop h4{grid-column:1/-1;margin:8px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shop .ck.done{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:12;background:var(--btn);color:var(--on-btn);padding:10px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:min(92vw,520px);box-shadow:0 8px 24px rgb(0 0 0 / .25)}
/* nutrients */
.nmode{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;max-width:100%}
.nmode button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.nmode button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.nutline{display:block;color:var(--muted);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.45}
.nrows{display:flex;flex-direction:column;gap:8px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13.5px;font-variant-numeric:tabular-nums}

/* Phases have no calendar dates: each starts when you pick it at the top and ends when your numbers say so (Measure tab). */
function phaseStartFor(phaseId){
  const st = store.settings, log = st.phases || {};
  if (st.phase === phaseId && st.phaseStart) return st.phaseStart;
  if (log[phaseId]) return log[phaseId];
  if (phaseId === "lead") return LEAD_START;
  const first = sortedDates().find(d => store.days[d].phase === phaseId);
  return first || st.phaseStart || LEAD_START;
}
function leadStart(){ return phaseStartFor("lead"); }
function leadWeek(date){ return Math.floor(daysBetween(leadStart(), date) / 7) + 1; }
/* week 1 of a phase is the first Monday on or after its start; days before that are the hand-off */
function phaseWeek1(phaseId){ const st = phaseStartFor(phaseId); const dw = parseISO(st).getDay(); return dw === 1 ? st : addDays(st, (8 - dw) % 7); }
function phaseWeekNo(phaseId, date){ if (phaseId === "lead") return leadWeek(date); const w1 = phaseWeek1(phaseId); return date < w1 ? 0 : Math.floor(daysBetween(w1, date) / 7) + 1; }
/* reset weeks: Phase 1 in week 8, Phases 2–4 in week 1, then every 8th week. Taking one early restarts the count from there. */
const RESET_FIRST = { p1: 8, p2: 1, p3: 1, p4: 1 };
function planResetStart(phaseId, date){

  const manual = (((store.settings.resetStarts || {})[phaseId]) || []).filter(d => d >= ps && d <= date).sort();
  const anchor = manual.length ? manual[manual.length - 1] : addDays(phaseWeek1(phaseId), (RESET_FIRST[phaseId] - 1) * 7);
  if (date < anchor) return null;
  const st = addDays(anchor, Math.floor(daysBetween(anchor, date) / 56) * 56);
  return daysBetween(st, date) < 7 ? st : null;
}
function planReset(phaseId, date){ return !!planResetStart(phaseId, date); }
function nextReset(phaseId, from){
  if (!RESET_FIRST[phaseId]) return null;
  for (let i = 0; i < 420; i++){ const d = addDays(from, i); const st = planResetStart(phaseId, d); if (st) return { start: st, end: addDays(st, 6), week: phaseWeekNo(phaseId, st), now: st <= from }; }
  return null;
}
function isReset(entry, phaseId){ if (entry && typeof entry.reset === "boolean") return entry.reset; return planReset(phaseId, entry.date); }

function dayPlan(phaseId, date, entry){

    if (wk <= 2){

      if (wk >= 1) notes.push(`Lead-in week ${wk}: pick weights you could lift 12–15 times and stop about 3 reps short. One set of Nordic curls, no box jumps, no intervals yet.`);

/* JP3 skinfold → body fat (men, age 21, as in the plan's table) */
function jp3(sum){ if (!sum) return null; const age = 21; const bd = 1.10938 - 0.0008267*sum + 0.0000016*sum*sum - 0.0002574*age; return 495/bd - 450; }
function sleepHours(bed, wake){
  if (!bed || !wake) return null;
  const [bh,bm] = bed.split(":").map(Number), [wh,wm] = wake.split(":").map(Number);
  if ([bh,bm,wh,wm].some(x => !Number.isFinite(x))) return null;
  let mins = (wh*60+wm) - (bh*60+bm); if (mins <= 0) mins += 1440; return mins/60;
}
const MEALS = [["breakfast","Breakfast"],["lunch","Lunch"],["snack","Snack"],["dinner","Dinner"],["extra","Before bed & extras"]];
function foodTotals(d){
  const sum = { kcal:[0,0], protein:[0,0], carbs:[0,0], fat:[0,0] };
  MEALS.forEach(([id]) => { const m = (d.meals || {})[id] || {}; [["kcal","kcal"],["protein","protein"],["carbs","carbs"],["fat","fat"]].forEach(([k, f]) => { const v = toNum(m[f]); if (v !== null){ sum[k][0] += v; sum[k][1]++; } }); });

  return `<div class="f"><span>${label}</span><div class="chips" role="group" aria-label="${esc(label)}">${b}</div>${note ? `<div class="scale-note">${note}</div>` : ""}</div>`;

const scale5 = (p, label, lo, hi) => chips(p, label, ["1","2","3","4","5"], `1 = ${lo} · 5 = ${hi}`);
function ck(p, label){ return `<label class="ck"><input type="checkbox" id="f-${p.replace(/\./g,"-")}" data-p="${p}" ${getP(draft,p) ? "checked" : ""}>${label}</label>`; }
function section(id, cls, title, body){

}

/* ---------- history lookups ---------- */
function sortedDates(){ return Object.keys(store.days).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort(); }
function lastBefore(date, pick){ const ds = sortedDates(); for (let i = ds.length-1; i >= 0; i--){ if (ds[i] < date){ const v = pick(store.days[ds[i]]); if (has(v)) return { date: ds[i], v }; } } return null; }
function lastEx(exId, date){ return lastBefore(date, d => { const e = d.train && d.train.ex && d.train.ex[exId]; return e && (has(e.w) || has(e.r)) ? e : null; }); }
function measureDue(date){
  const w = lastBefore(date, d => d.m && toNum(d.m.waist));
  const f = lastBefore(date, d => d.m && toNum(d.m.shoulders));
  const cur = draft.m || {};
  return {
    waist: !toNum(cur.waist) && (!w || daysBetween(w.date, date) >= 14), waistLast: w,
    full: !toNum(cur.shoulders) && (!f || daysBetween(f.date, date) >= 28), fullLast: f
  };
}

function workoutStats(d, phaseId, date){
  const plan = dayPlan(phaseId, date, d); if (!plan.work) return null;
  let total = 0, done = 0, rated = 0;
  const exs = plan.work.ex.filter(e => !e.only || e.only.includes(phaseId));
  exs.forEach(e => { const x = ((d.train || {}).ex || {})[e.id] || {}; const sets = legacySets(x); const n = x.n || Math.max(exDefaultSets(e, phaseId, date), sets.length); total += n; done += Math.min(n, sets.filter(z => z.done).length); if (x.feel) rated++; });
  return { total, done, rated, exN: exs.length };
}

/* derived values & summaries (no re-render, so typing never loses focus) */
function weekDates(date){ const d = parseISO(date); const off = (d.getDay() + 6) % 7; const mon = addDays(date, -off); return Array.from({length:7}, (_, i) => addDays(mon, i)); }
function entryFor(date){ return date === curDate ? draft : store.days[date]; }
function updateDerived(){
  const phaseId = phaseOf(draft), P = PH[phaseId];
  const plan = dayPlan(phaseId, curDate, draft);
  const kc = targetKcal(phaseId, plan.reset);
  const s = draft.sleep || {};
  const hrs = sleepHours(s.bed, s.wake);
  const el = id => document.getElementById(id);
  if (el("calc-sleep")) el("calc-sleep").innerHTML = hrs !== null ? `<strong>${fmt(hrs,1)} h</strong><span class="pill ${hrs >= 7.5 ? "ok" : hrs >= 7 ? "info" : hrs >= 6.5 ? "warn" : "bad"}">${hrs >= 7.5 ? "In the 7.5–9 h window" : hrs >= 7 ? "Just under 7.5 h" : hrs >= 6.5 ? "Short night" : "Under 6.5 h"}</span>` : `<span class="muted small">Add bed and wake times to see hours in bed.</span>`;
  const wk = weekDates(curDate);
  const ws = wk.map(d => toNum((entryFor(d) || {}).weight)).filter(v => v !== null);
  if (el("calc-wavg")) el("calc-wavg").innerHTML = ws.length ? `<strong>${fmt(ws.reduce((a,b)=>a+b,0)/ws.length,1)} lb</strong><span class="muted small">${ws.length} weigh-in${ws.length>1?"s":""} this week</span>` : `<span class="muted small">No weigh-ins this week yet.</span>`;
  const st = wk.map(d => toNum(((entryFor(d) || {}).cardio || {}).steps)).filter(v => v !== null);
  if (el("calc-steps")) el("calc-steps").innerHTML = st.length ? `<strong>${fmt(st.reduce((a,b)=>a+b,0)/st.length)}</strong><span class="muted small">over ${st.length} day${st.length>1?"s":""}</span>` : `<span class="muted small">No steps logged this week yet.</span>`;
  const ft = foodTotals(draft);
  const pT = P.pT || toNum(P.p) || 160;
  if (el("calc-food")){
    const bar = (lab, v, t, unit) => { const pct = v && t ? Math.min(100, v/t*100) : 0; const over = v && t && v > t*1.05;
      return `<div class="bar"><div class="lab"><span>${lab}</span><span>${v !== null ? fmt(v) : "–"} / ${t ? fmt(t) : "–"} ${unit}</span></div><div class="track"><div class="fill${over ? " over" : ""}" style="width:${pct}%"></div></div></div>`; };
    el("calc-food").innerHTML = bar("Calories", ft.kcal, kc, "kcal") + bar("Protein", ft.protein, pT, "g") +
      (phaseId !== "lead" && phaseId !== "after" && ft.kcal !== null && ft.kcal < 1900 ? `<div class="notice warn"><b>Under the 1,900 kcal floor.</b> If the day is done, that's fine once. Don't let it become a habit.</div>` : "");
  }
  const m = draft.m || {};
  const sum = [m.cChest, m.cAbs, m.cThigh].map(toNum);
  if (el("calc-cal")) el("calc-cal").innerHTML = sum.every(v => v !== null) ? (() => { const S = sum[0]+sum[1]+sum[2]; const bf = jp3(S); return `<span>Sum</span><strong>${fmt(S,1)} mm</strong><span>≈</span><strong>${fmt(bf,1)}%</strong><span class="muted small">body fat. Finish line is 36–38 mm (~10%). Trust the trend more than the %.</span>`; })() : `<span class="muted small">Enter all three folds to get the sum and body-fat estimate.</span>`;

  /* summaries */
  const setSum = (id, t) => { const e = el("sum-" + id); if (e) e.textContent = t; };
  setSum("sleep", [hrs !== null ? fmt(hrs,1) + " h in bed" : null, s.quality ? `quality ${s.quality}/5` : null, toNum(draft.weight) ? `${draft.weight} lb` : null].filter(Boolean).join(" · ") || "Bed, wake, quality, weight");
  setSum("food", [ft.kcal !== null ? `${fmt(ft.kcal)} / ${fmt(kc)} kcal` : null, ft.protein !== null ? `${fmt(ft.protein)} / ${pT} g protein` : null].filter(Boolean).join(" · ") || "Breakfast, lunch, snack, dinner");
  const tr = draft.train || {};
  const wst = workoutStats(draft, phaseId, curDate);
  setSum("train", plan.work ? [plan.work.name, wst ? `${wst.done}/${wst.total} sets` : null, tr.feelAfter ? `felt ${tr.feelAfter}/5` : null].filter(Boolean).join(" · ") : "Rest day");
  if (el("tsum") && wst) el("tsum").textContent = `${wst.done} of ${wst.total} sets done · ${wst.rated} of ${wst.exN} exercises rated`;
  const c = draft.cardio || {};
  setSum("cardio", [toNum(c.steps) !== null ? fmt(toNum(c.steps)) + " steps" : null, c.status ? {done:"cardio done",partial:"cut short",z2:"swapped for zone 2",skipped:"cardio skipped"}[c.status] : null, toNum(c.walkMin) ? `${c.walkMin} min walk` : null].filter(Boolean).join(" · ") || (plan.cond ? "Steps + today's session" : "Steps"));
  const due = mSchedule(curDate);
  setSum("measure", [toNum(m.waist) ? `waist ${inch(toNum(m.waist))}` : null, sum.every(v => v !== null) ? `${fmt(sum[0]+sum[1]+sum[2],1)} mm` : null].filter(Boolean).join(" · ") || (due.keys.length ? `${dueLabel(due.keys)} due` : "Not due today"));
  const f = draft.feel || {};
  setSum("day", [f.overall ? `day ${f.overall}/5` : null, f.mood ? `mood ${f.mood}/5` : null, f.forClaude ? "note for Claude" : null].filter(Boolean).join(" · ") || "Energy, mood, notes for Claude");
  updateWorkoutProgress();
  updateMeasureDerived();
}

/* ---------- shared form events (Today + Workout) ---------- */
function bindView(el){
  el.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset && t.dataset.sw){ onSetInput(t); return; }
    const p = t.dataset && t.dataset.p; if (!p) return;
    setP(draft, p, t.type === "checkbox" ? t.checked : t.value);
    const rm = p.match(/^m\.(waist|cChest|cAbs|cThigh)([123])$/); if (rm) syncRounds(rm[1], Number(rm[2]));
    markDirty(); updateDerived();
  });
  el.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset && "pick" in t.dataset){ if (t.value) goDate(t.value); return; }
    if (t.id === "resetToggle"){ draft.reset = t.checked; markDirty(); renderCurrent(); return; }
    if (t.dataset && t.dataset.p && t.type === "checkbox"){ setP(draft, t.dataset.p, t.checked); markDirty(); updateDerived(); }
  });
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || !el.contains(b)) return;
    if (b.dataset.nav){ const n = b.dataset.nav; goDate(n === "prev" ? addDays(curDate, -1) : n === "next" ? addDays(curDate, 1) : n === "today" ? iso(new Date()) : n); return; }
    if (b.dataset.go){ goTab(b.dataset.go); return; }
    if (b.dataset.act){ onSetAction(b); return; }
    if (b.dataset.reset){ onReset(b.dataset.reset, el); return; }
    if (b.classList.contains("chip") && b.dataset.p){
      const p = b.dataset.p, v = b.dataset.v; const cur = String(val(p));
      setP(draft, p, cur === v ? "" : v);
      $$(".chip", b.parentElement).forEach(x => x.setAttribute("aria-pressed", String(String(val(p)) === x.dataset.v)));
      markDirty();
      if (p === "cardio.ab") renderToday();
      else if (/^train\.ex\.[^.]+\.feel$/.test(p)) rerenderCard(p.split(".")[2]);
      else updateDerived();
    }
  });
  el.addEventListener("toggle", e => {
    const d = e.target; if (!d.dataset || !d.dataset.sec) return;
    openState[d.dataset.sec] = d.open; ls.set("rt10-open", openState);
  }, true);
}

    <button type="button" class="iconbtn" data-nav="next" aria-label="Next day">›</button></div>

/* ---------- WORKOUT ---------- */
const FEEL = { easy:"too easy", right:"just right", hard:"hard", heavy:"too heavy" };
let restTimer = null, restEnd = 0, restLabel = "", wl = null;
function parseRx(rx){

  if (!m) return { sets:3, lo:10, hi:10 };
  return { sets: Number(m[2] || m[1]), lo: Number(m[3]), hi: Number(m[4] || m[3]) };
}
function exDefaultSets(e, phaseId, date){ if (e.lead && phaseId === "lead" && leadWeek(date) <= 2) return 1; return parseRx(e.rx).sets; }
function findEx(id){ for (const k in WORK){ const e = WORK[k].ex.find(x => x.id === id); if (e) return e; } return null; }
function exData(id){ return ((draft.train || {}).ex || {})[id] || {}; }
function legacySets(x){

  return (reps.length ? reps : [""]).map(r => ({ w: x.w || "", r: r.replace(/[^\d.]/g, ""), done: true }));
}
function lastSession(id, date){

}
function setCount(e, phaseId){ const x = exData(e.id); return x.n || Math.max(exDefaultSets(e, phaseId, curDate), legacySets(x).length); }
function suggest(e, i, last){

  return { w: ls && has(ls.w) ? String(ls.w) : "", r: ls && has(ls.r) ? String(ls.r) : String(rx.hi) };
}
function setView(e, i, last){
  const s = legacySets(exData(e.id))[i]; const sg = suggest(e, i, last);
  return { w: s && has(s.w) ? String(s.w) : sg.w, r: s && has(s.r) ? String(s.r) : sg.r, done: !!(s && s.done), suggW: !(s && has(s.w)), suggR: !(s && has(s.r)) };
}
function ensureSet(id, i){

}
function syncSummary(id){
  const x = getP(draft, `train.ex.${id}`); if (!x || !Array.isArray(x.sets)) return;
  const done = x.sets.filter(z => z.done);
  const ws = done.map(z => String(z.w || ""));
  const same = ws.length && ws.every(w => w === ws[0]);
  x.w = same ? ws[0] : "";
  x.r = done.map(z => same ? (z.r || "–") : `${z.w || "–"}×${z.r || "–"}`).join(", ");
}
function fmtW(n){ return String(Math.round(n * 100) / 100); }
function restText(sec){ return sec >= 60 ? (sec % 60 ? `${Math.floor(sec/60)}:${pad(sec%60)}` : `${sec/60} min`) : `${sec} s`; }
function stepperHTML(e, i, f, v){

  const unit = isW ? (e.assist ? "lb · minus = assist" : "lb") : (e.timed ? "seconds" : "reps");
  return `<div class="stepper"><button type="button" data-act="dec" data-ex="${e.id}" data-set="${i}" data-f="${f}" aria-label="${isW ? "Less weight" : "Fewer"}">−</button>
    <label><input type="text" inputmode="${isW && e.assist ? "text" : "decimal"}" data-sw="${e.id}|${i}|${f}" value="${esc(value)}" placeholder="–" class="${sugg && !v.done ? "sugg" : ""}" aria-label="Set ${i+1} ${isW ? "weight" : unit}" autocomplete="off"><small>${unit}</small></label>
    <button type="button" data-act="inc" data-ex="${e.id}" data-set="${i}" data-f="${f}" aria-label="${isW ? "More weight" : "More"}">+</button></div>`;

function progressionHint(e, last){

  if (sets.length >= rx.sets && sets.every(z => toNum(z.r) !== null && toNum(z.r) >= rx.hi))
    return e.bw ? `You hit ${rx.hi}+ on every set last time. Make it harder: slower lowering or a harder version.` : `You hit ${rx.hi}+ on every set last time. Go up a weight today.`;

}
function exCardHTML(e, phaseId){

    <div class="setbtns"><button type="button" class="textbtn" data-act="addset" data-ex="${e.id}">+ Add set</button>${n > 1 ? `<button type="button" class="textbtn" data-act="rmset" data-ex="${e.id}">− Remove set</button>` : ""}</div>
    <div class="feelbox${allDone && !x.feel ? " ask" : ""}">
      ${chips(p + ".feel", allDone && !x.feel ? "Done! How did that feel?" : "How did it feel?", [["easy","Too easy"],["right","Just right"],["hard","Hard"],["heavy","Too heavy"]])}

function rerenderCard(id){

function onSetAction(b){
  const act = b.dataset.act, id = b.dataset.ex, e = findEx(id); if (!e || mode === "readonly") return;
  const phaseId = phaseOf(draft); const last = lastSession(id, curDate); const n = setCount(e, phaseId);
  if (act === "addset" || act === "rmset"){
    const x = getP(draft, `train.ex.${id}`) || {};

    if (act === "addset") x.n = n + 1; else if (n > 1){ x.n = n - 1; x.sets = x.sets.slice(0, n - 1); }
    setP(draft, `train.ex.${id}`, x); syncSummary(id); markDirty(); rerenderCard(id); return;
  }
  const i = Number(b.dataset.set); const v = setView(e, i, last); const s = ensureSet(id, i);
  if (act === "inc" || act === "dec"){
    const f = b.dataset.f; const step = f === "w" ? (e.inc || 5) : (e.timed ? 5 : 1);
    const cur = toNum(f === "w" ? v.w : v.r);
    let nv = (cur === null ? 0 : cur) + (act === "inc" ? step : -step);
    if (f === "r" || !e.assist) nv = Math.max(0, nv);
    s[f] = fmtW(nv);
    const other = f === "w" ? "r" : "w";
    if (!has(s[other]) && !(other === "w" && e.bw)) s[other] = other === "w" ? v.w : v.r;
    [f, other].forEach(k => { const inp = document.querySelector(`input[data-sw="${id}|${i}|${k}"]`); if (inp && has(s[k])){ inp.value = s[k]; inp.classList.remove("sugg"); } });
    syncSummary(id); markDirty(); updateDerived(); return;
  }
  if (act === "done"){
    if (!s.done){
      if (!has(s.w) && !e.bw) s.w = v.w; if (!has(s.r)) s.r = v.r; s.done = true;
      let label;
      if (i + 1 < n) label = `set ${i + 2} of ${e.n}`;
      else { const plan = dayPlan(phaseId, curDate, draft); const exs = plan.work ? plan.work.ex.filter(z => !z.only || z.only.includes(phaseId)) : []; const k = exs.findIndex(z => z.id === id); label = exs[k + 1] ? exs[k + 1].n : "finish the workout"; }

}
function onSetInput(t){

function startRest(sec, label){

  const bar = $("#restBar"); bar.hidden = false; bar.classList.remove("over"); document.body.classList.add("resting");
  clearInterval(restTimer); restTimer = setInterval(tickRest, 250); tickRest();
}
function tickRest(){
  const left = Math.ceil((restEnd - Date.now()) / 1000); const bar = $("#restBar");
  if (left > 0){ bar.classList.remove("over"); $("#restTime").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`; $("#restLab").textContent = "Rest · next: " + restLabel; return; }
  bar.classList.add("over"); $("#restTime").textContent = "Go"; $("#restLab").textContent = "Rest's up · next: " + restLabel;
  if (left < -30) stopRest();
}
function stopRest(){ clearInterval(restTimer); restTimer = null; $("#restBar").hidden = true; document.body.classList.remove("resting"); }
$("#restBar").addEventListener("click", e => {
  const b = e.target.closest("[data-rest]"); if (!b) return;
  if (b.dataset.rest === "skip"){ stopRest(); return; }

});
async function wakeLock(on){

    if (on && "wakeLock" in navigator && !wl && document.visibilityState === "visible"){ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); }
    else if (!on && wl){ const w = wl; wl = null; await w.release(); }

}

function exLine(def, x){
  if (!x) return null;
  const sets = legacySets(x).filter(z => z.done); const parts = [];
  if (sets.length) parts.push(sets.map(z => (has(z.w) && !def.bw ? z.w + "×" : "") + (has(z.r) ? z.r + (def.timed ? "s" : "") : "–")).join(", "));

/* ---------- HISTORY ---------- */
function weekKey(date){ return weekDates(date)[0]; }
function trendChip(phaseId, rate){
  if (rate === null) return `<span class="muted">–</span>`;
  const r = rate; const T = PH[phaseId].trend;
  const lbl = (r >= 0 ? "−" : "+") + fmt(Math.abs(r),2) + " lb/wk";
  if (T === "maint") return Math.abs(r) <= 0.5 ? `<span class="pill ok">${lbl} · holding</span>` : r > 0 ? `<span class="pill info">${lbl} · dropping</span>` : `<span class="pill warn">${lbl} · climbing</span>`;
  if (r > T.fast) return `<span class="pill bad">${lbl} · too fast</span>`;
  if (r >= T.on[0]) return `<span class="pill ok">${lbl} · on track</span>`;
  if (r >= T.fine) return `<span class="pill ok">${lbl} · fine</span>`;
  return `<span class="pill warn">${lbl} · slow</span>`;
}
function weeklyRows(){
  const ds = sortedDates(); const groups = {};
  ds.forEach(d => { const k = weekKey(d); (groups[k] = groups[k] || []).push(d); });
  const keys = Object.keys(groups).sort();
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const rows = keys.map(k => {
    const days = groups[k].map(d => store.days[d]);
    const ph = {}; days.forEach(e => { const p = phaseOf(e); ph[p] = (ph[p]||0)+1; });
    const phaseId = Object.keys(ph).sort((a,b)=>ph[b]-ph[a])[0];
    const w = avg(days.map(e => toNum(e.weight)).filter(v => v !== null));
    const kcal = avg(days.map(e => foodTotals(e).kcal).filter(v => v !== null));
    const prot = avg(days.map(e => foodTotals(e).protein).filter(v => v !== null));
    const steps = avg(days.map(e => toNum((e.cardio||{}).steps)).filter(v => v !== null));
    const sleep = avg(days.map(e => sleepHours((e.sleep||{}).bed, (e.sleep||{}).wake)).filter(v => v !== null));
    const lifts = days.filter(e => ["done","partial"].includes((e.train||{}).status)).length;
    const waistE = days.filter(e => toNum((e.m||{}).waist) !== null).pop();
    const calE = days.filter(e => ["cChest","cAbs","cThigh"].every(f => toNum((e.m||{})[f]) !== null)).pop();
    const cal = calE ? ["cChest","cAbs","cThigh"].reduce((a,f)=>a+toNum(calE.m[f]),0) : null;
    const dayAvg = avg(days.map(e => toNum((e.feel||{}).overall)).filter(v => v !== null));
    return { k, phaseId, w, kcal, prot, steps, sleep, lifts, waist: waistE ? toNum(waistE.m.waist) : null, cal, dayAvg, n: days.length };
  });
  rows.forEach((r, i) => {
    const two = rows.find(x => x.k === addDays(r.k, -14) && x.w !== null);
    const one = rows.find(x => x.k === addDays(r.k, -7) && x.w !== null);
    r.rate = r.w === null ? null : two ? (two.w - r.w)/2 : one ? (one.w - r.w) : null;
  });
  return rows.reverse();
}

  const wkTable = rows.length ? `<div class="scroll-x"><table>
    <thead><tr><th>Week of</th><th>Phase</th><th class="num">Avg weight</th><th>Trend</th><th class="num">Calories</th><th class="num">Protein</th><th class="num">Steps</th><th class="num">Sleep</th><th class="num">Lifts</th><th class="num">Waist</th><th class="num">Calipers</th><th class="num">Day</th></tr></thead>

function drawChart(){
  const host = $("#chart"); if (!host) return;
  let pts = sortedDates().map(d => ({ d, w: toNum(store.days[d].weight) })).filter(p => p.w !== null);
  if (chartRange === "8w"){ const cut = addDays(iso(new Date()), -56); pts = pts.filter(p => p.d >= cut); }
  if (pts.length < 2){ host.innerHTML = `<p class="empty">Weigh in on at least two mornings${chartRange === "8w" ? " in the last 8 weeks" : ""} to see your trend line.</p>`; return; }
  pts.forEach(p => { const win = pts.filter(q => q.d <= p.d && daysBetween(q.d, p.d) < 7); p.a = win.reduce((s,q)=>s+q.w,0)/win.length; p.t = parseISO(p.d).getTime(); });
  const W = Math.max(300, Math.round(host.clientWidth || 680)), H = W < 500 ? 220 : 260, m = {l:40, r:12, t:22, b:28};
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  let lo = Math.min(...pts.map(p=>p.w)), hi = Math.max(...pts.map(p=>p.w));
  const span = Math.max(4, hi - lo); const step = span > 30 ? 10 : span > 12 ? 5 : 2;
  lo = Math.floor((lo - 1)/step)*step; hi = Math.ceil((hi + 1)/step)*step;
  const x = t => m.l + (t1 === t0 ? 0.5 : (t - t0)/(t1 - t0)) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - lo)/(hi - lo)) * (H - m.t - m.b);
  let g = "";
  for (let v = lo; v <= hi + 0.001; v += step){ g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)" stroke-width="1"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; }
  const xt = [pts[0], pts[Math.floor(pts.length/2)], pts[pts.length-1]].filter((p,i,a) => a.indexOf(p) === i);
  xt.forEach((p, i) => { g += `<text x="${x(p.t)}" y="${H-8}" text-anchor="${i===0?"start":i===xt.length-1?"end":"middle"}" font-size="11" fill="var(--muted)">${MON[parseISO(p.d).getMonth()]} ${parseISO(p.d).getDate()}</text>`; });
  const dots = pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.w)}" r="4" fill="color-mix(in srgb, var(--blue) 35%, var(--surface))" stroke="var(--surface)" stroke-width="2"/>`).join("");
  const path = pts.map((p,i) => `${i?"L":"M"}${x(p.t).toFixed(1)},${y(p.a).toFixed(1)}`).join("");
  const last = pts[pts.length-1];
  host.innerHTML = `<div class="legend"><span><i style="width:9px;height:9px;border-radius:50%;background:color-mix(in srgb, var(--blue) 35%, var(--surface))"></i>Morning weight</span><span><i style="width:16px;height:2px;background:var(--blue)"></i>7-day average</span></div>
    <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time, latest 7-day average ${fmt(last.a,1)} pounds">${g}${dots}
      <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(last.t)}" cy="${y(last.a)}" r="5" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${Math.min(x(last.t), W - m.r)}" y="${y(last.a) - 12}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${fmt(last.a,1)} lb</text>
      <line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
      <rect id="hit" x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" tabindex="0"/></svg>
      <div class="chart-tip" id="tip" hidden></div></div>`;
  const svg = $("svg", host), hit = $("#hit", host), xh = $("#xh", host), tip = $("#tip", host);
  let idx = pts.length - 1;
  const show = i => {
    idx = Math.max(0, Math.min(pts.length-1, i)); const p = pts[idx];
    const sx = x(p.t); xh.setAttribute("x1", sx); xh.setAttribute("x2", sx); xh.setAttribute("visibility","visible");
    tip.hidden = false; tip.textContent = "";
    const s = document.createElement("strong"); s.textContent = `${fmt(p.w,1)} lb`; tip.appendChild(s);
    tip.appendChild(document.createTextNode(`7-day avg ${fmt(p.a,1)} · ${fmtDate(p.d)}`));
    const box = svg.getBoundingClientRect(); const px = sx / W * box.width;
    tip.style.left = Math.max(0, Math.min(box.width - tip.offsetWidth, px - tip.offsetWidth/2)) + "px"; tip.style.top = "4px";
  };
  const near = ev => { const box = svg.getBoundingClientRect(); const vx = (ev.clientX - box.left)/box.width*W; let best = 0, bd = Infinity; pts.forEach((p,i) => { const d = Math.abs(x(p.t)-vx); if (d < bd){ bd = d; best = i; } }); return best; };
  hit.addEventListener("pointermove", ev => show(near(ev)));
  hit.addEventListener("pointerdown", ev => show(near(ev)));
  hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility","hidden"); tip.hidden = true; });
  hit.addEventListener("focus", () => show(idx));
  hit.addEventListener("blur", () => { xh.setAttribute("visibility","hidden"); tip.hidden = true; });
  hit.addEventListener("keydown", ev => { if (ev.key === "ArrowLeft"){ show(idx-1); ev.preventDefault(); } if (ev.key === "ArrowRight"){ show(idx+1); ev.preventDefault(); } });
}

    ${card("Lifting", "var(--red)", block("sessions", "Lifting sessions per week") + `<div class="chhead" style="margin-top:4px"><h3>Strength: heaviest set each session</h3></div><div class="multi" id="ch-strength"></div><div class="two-d">${block("exfeel", "How exercises felt")}</div>` + block("wfeel", "After-workout feel and soreness"))}

}
function drawAllCharts(sp){
  const H = id => document.getElementById("ch-" + id);

  const delta = (pts, dp, unit) => { if (pts.length < 2) return ""; const dv = pts[pts.length - 1].v - pts[0].v; return `${dv > 0 ? "+" : dv < 0 ? "−" : "±"}${fmt(Math.abs(dv), dp).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "")}${unit} in this range`; };

  const in1 = v => fmt(v, 2).replace(/\.?0+$/, "") + "″";

  sub("weight", wa.length ? `7-day avg ${fmt(lastV(wa), 1)} lb · ${delta(wa, 1, " lb")}` : "");

  sub("waist", wsp.length ? `Latest ${in1(lastV(wsp))} · ${delta(wsp, 2, "″")} · goal about 30–31″` : "goal about 30–31″");
  const cal = pick(sp, e => { const m = e.m || {}; const v = ["cChest","cAbs","cThigh"].map(k => toNum(m[k])); return v.every(z => z !== null) ? v[0] + v[1] + v[2] : null; });
  drawTime(H("cal"), Object.assign({}, base, { kind:"line", minSpan:10, series:[{ name:"Caliper sum", pts: cal }], vFmt: v => fmt(v, 1) + " mm", tipExtra: d => { const p = cal.find(q => q.d === d); return p ? `≈ ${fmt(jp3(p.v), 1)}% body fat` : ""; }, empty:"Take the 3-site caliper check every 2 weeks.", aria:"Caliper sum" }));
  sub("cal", cal.length ? `Latest ${fmt(lastV(cal), 1)} mm ≈ ${fmt(jp3(lastV(cal)), 1)}% · finish line 36–38 mm` : "finish line 36–38 mm (~10%)");
  const ratio = pick(sp, e => { const m = e.m || {}; const a = toNum(m.shoulders), b = toNum(m.waist); return a && b ? a / b : null; });
  drawTime(H("ratio"), Object.assign({}, base, { kind:"line", minSpan:0.1, series:[{ name:"Shoulders ÷ waist", pts: ratio }], vFmt: v => fmt(v, 2), yFmt: v => fmt(v, 2), empty:"Needs shoulders and waist measured on the same day.", aria:"Shoulder to waist ratio" }));
  sub("ratio", ratio.length ? `Latest ${fmt(lastV(ratio), 2)} · goal 1.45 at the end of the cut, 1.53 later` : "goal 1.45 at the end of the cut, 1.53 later");
  const TAPE = [["shoulders","Shoulders"],["chest","Chest"],["armF","Arm flexed"],["armR","Arm relaxed"],["thighR","Thigh (right)"],["calfR","Calf (right)"],["neck","Neck"],["hips","Hips"]];
  const tapeHost = H("tape"); const tapeData = TAPE.map(([k, l]) => ({ k, l, pts: pick(sp, e => toNum((e.m || {})[k])) })).filter(z => z.pts.length);

  drawTime(H("kcal"), Object.assign({}, base, { kind:"bar", series:[{ name:"Calories", pts: kc }], refPts: kcT, vFmt: v => fmt(v) + " kcal", tipExtra: d => { const t = kcT.find(q => q.d === d); return t ? `Target ${fmt(t.v)}` : ""; }, empty:"Log your meals to see calories per day.", aria:"Calories per day" }));

  const hun = pick(sp, e => toNum((e.food || {}).hunger));
  drawTime(H("hunger"), Object.assign({}, r15, { series:[{ name:"Hunger", pts: hun, color:"var(--s2)" }], empty:"Rate your hunger each day.", aria:"Hunger" }));

  sub("sessions", sess.length ? `${sess[sess.length - 1].v} this week` : "");

    stData.forEach((z, i) => drawTime(document.getElementById("ms-" + i), Object.assign({}, base, { kind:"line", small:true, minSpan:10, series:[{ name: z.L.n, pts: z.pts }], vFmt: v => fmt(v, 1).replace(/\.0$/, "") + " lb", aria: z.L.n })));

  const fa = pick(sp, e => toNum((e.train || {}).feelAfter)), so = pick(sp, e => toNum((e.train || {}).soreness));
  drawTime(H("wfeel"), Object.assign({}, r15, { series:[{ name:"Felt after", pts: fa }, { name:"Soreness", pts: so }], empty:"Rate how you felt after workouts and your soreness.", aria:"After-workout feel and soreness" }));

async function pushFile(path, build, mergeRemote){
  for (let attempt = 0; attempt < 3; attempt++){
    const g = await gh("GET", "/contents/" + path); let sha = null;
    if (g.ok && g.json){ sha = g.json.sha; if (g.json.content){ try { await mergeRemote(JSON.parse(b64dec(g.json.content))); } catch(err){} } }
    else if (g.status !== 404) throw ghError(g);
    const p = await gh("PUT", "/contents/" + path, Object.assign({ message: `Road to 10%: update ${path}`, content: b64enc(JSON.stringify(build())) }, sha ? { sha } : {}));
    if (p.ok){ cloud.shas[path] = p.json && p.json.content ? p.json.content.sha : null; return; }
    if (p.status !== 409 && p.status !== 422) throw ghError(p);
  }
  const e = new Error("conflict"); e.kind = "other"; throw e;
}
async function cloudPush(){
  if (!cloud || cloudBusy || mode !== "idb") return;
  clearTimeout(cloudTimer);
  if (dirty){ await flush(); }
  if (!cloudPending()){ setCloudState("ok"); return; }
  if (navigator.onLine === false){ setCloudState("offline"); return; }
  cloudBusy = true; setCloudState("busy");
  let pulledChange = false;
  try {
    for (const ym of Object.keys(cloudDirty.months).sort()){
      const seq = cloudDirty.months[ym];
      await pushFile(`log/${ym}.json`, () => { const days = {}; sortedDates().filter(d => d.startsWith(ym)).forEach(d => { days[d] = store.days[d]; }); return { app:"road-to-10", month: ym, days }; },
        async remote => { if (await mergeRemoteDays(remote.days)) pulledChange = true; });
      if (cloudDirty.months[ym] === seq) delete cloudDirty.months[ym];
      cloudSaveDirty();
    }
    if (cloudDirty.settings){
      const seq = cloudDirty.settings;
      await pushFile("settings.json", () => clone(store.settings), async rs => { if (await mergeRemoteSettings(rs)) pulledChange = true; });
      if (cloudDirty.settings === seq) cloudDirty.settings = 0;
      cloudSaveDirty();
    }
    cloud.lastPush = new Date().toISOString(); cloudSaveCfg();
    cloudBusy = false; setCloudState(cloudPending() ? "pending" : "ok");
  } catch(e){ cloudBusy = false; setCloudState(e.kind || "other"); if (e.kind === "offline" || e.kind === "other") { clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 60000); } }
  if (pulledChange) rerenderAll();
  if (cloudPending() && cloudState.kind === "pending") cloudSchedule();
}
async function cloudSync(){
  if (!cloud || mode !== "idb") return;
  try { setCloudState("busy"); const n = await cloudPull(); if (n){ rerenderAll(); renderModeNote(); } cloudBusy = false; await cloudPush(); }
  catch(e){ setCloudState(e.kind || "other"); }
}
async function cloudConnect(owner, repo, token){
  const msg = t => { const m = document.getElementById("cloudMsg"); if (m) m.textContent = t; };
  if (!owner || !repo || !token){ msg("Fill in all three boxes."); return; }
  if (mode !== "idb"){ msg("Open the app from its Home Screen icon to turn on cloud backup."); return; }
  const prev = cloud;
  cloud = { owner: owner.trim().replace(/^@/, ""), repo: repo.trim(), token: token.trim(), shas: {} };
  msg("Connecting…");
  try {
    const r = await gh("GET", "");
    if (!r.ok) throw ghError(r);
    if (!r.json || r.json.private !== true){ cloud = prev; msg("That repository is public, so anyone could read your log. On GitHub, open the repository's Settings, scroll to the bottom and change its visibility to Private, then connect again."); return; }
    cloudSaveCfg(); cloudDirty = { months: {}, settings: 0, seq: cloudDirty.seq || 0 };
    const n = await cloudPull();
    await cloudPush();
    rerenderAll(); renderModeNote();
    if (tab === "share") renderShare();
    const m = document.getElementById("cloudMsg"); if (m) m.textContent = n ? `Connected. Your log is back: ${sortedDates().length} day${sortedDates().length === 1 ? "" : "s"} restored from the cloud.` : "Connected. Everything on this iPhone is now backed up.";
  } catch(e){ cloud = prev; cloudSaveCfg(); msg(e.kind === "offline" ? "You're offline. Connect to the internet and try again." : cloudMsg(e.kind)); setCloudState(prev ? cloudState.kind : "off"); }
}

(async () => {

    }).catch(() => {});
